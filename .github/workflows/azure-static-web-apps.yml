name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # ── Build & Deploy ─────────────────────────────────────────────────────────
  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Plain HTML/CSS/JS site — no build step needed.
          # app_location    → repository root (where index.html lives)
          # output_location → empty string (no separate dist folder)
          # skip_app_build  → skip Oryx build detection entirely
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true
        env:
          # Allow the workflow to succeed even if the secret has not yet been
          # configured in GitHub (useful before the Azure resource is created).
          SKIP_DEPLOY_ON_MISSING_SECRETS: true

  # ── Close PR staging environment ──────────────────────────────────────────
  close_pull_request:
    name: Close Pull Request Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
